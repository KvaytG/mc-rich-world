# Список разрешённых команд (без слеша!), которые можно
# использовать. Все остальные команды не будут работать,
# при условии отсутствия у игрока прав Оператора.
# Команды НЕ чувствительны к регистру!
whitelist:
    - 'balance'
    - 'donate'
    - 'vip'
    - 'upd'
    - 'upg'
# Сообщения
messages:
    # Выведется, если команда не прописана в белом списке и
    # у игрока при этом нет прав Оператора
    notFound: "&#FF0000Данной команды не существует, либо она заблокирована"
    # Выведется, если команда прописана в белом списке, но у игрока
    # отсутствует право "command.НАЗВАНИЕ" на её использование.
    noPerms: "&#FF0000У вас недостаточно прав для этой команды"